<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>RMG NetGuard</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box;margin:0;padding:0}body{background:#121417;color:#d7dce2;font:14px/1.5 -apple-system,sans-serif;padding:12px}.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #232931}h1{font-size:15px;color:#fff}.ver{font-size:12px;color:#7d8792}.card{background:#1a1e24;border:1px solid #28303b;border-radius:8px;padding:9px 11px;margin-bottom:9px}.card h2{font-size:12px;color:#8b99a8;margin-bottom:5px}.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}.row span{color:#9aa7b5;font-size:13px}.badge{padding:2px 7px;border-radius:4px;font-size:12px;font-weight:600}.b-ok{background:#153722;color:#4ade80}.b-warn{background:#3b2a12;color:#fbbf24}.b-risk{background:#3b1818;color:#f87171}.b-info{background:#172a3f;color:#60a5fa}.b-mut{background:#232a34;color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}button{background:#222a35;color:#e2e8f0;border:1px solid #334050;border-radius:6px;padding:8px 4px;font-size:13px;cursor:pointer}button:active{background:#2d3748}button:disabled{opacity:.4;cursor:not-allowed}.btn-ac{border-color:#1e4976;color:#7dd3fc}.log{background:#15181c;border:1px solid #252c36;border-radius:6px;padding:7px;font:11px/1.35 monospace;color:#94a3b8;white-space:pre-wrap;word-break:break-all;max-height:100px;overflow-y:auto}.tip{color:#64748b;font-size:11px;text-align:center}</style>
</head>
<body>
<div class="hdr"><h1>RMG NetGuard</h1><span class="ver" id="ui_ver">v3.1.2</span></div>
<div class="card">
<h2>实时运行拓扑</h2>
<div class="row"><span>守卫模式</span><b id="m1"><span class="badge b-mut">读取中…</span></b></div>
<div class="row"><span>VPN 状态</span><b id="m2"><span class="badge b-mut">--</span></b></div>
<div class="row"><span>53 端口劫持</span><b id="m3"><span class="badge b-mut">--</span></b></div>
<div class="row"><span>AdGuardHome</span><b id="m4"><span class="badge b-mut">--</span></b></div>
<div class="row"><span>Clash 串联补丁</span><b id="m5"><span class="badge b-mut">--</span></b></div>
</div>
<div class="grid">
<button id="b1" onclick="actMode()">模式切换</button>
<button id="b2" onclick="actHijack()">劫持挂摘</button>
<button id="b3" onclick="actInteg()">串联补丁</button>
<button id="b4" class="btn-ac" onclick="loadStatus()">刷新状态</button>
</div>
<div class="card">
<h2>控制台响应</h2>
<div id="log_out" class="log">正在连接 KernelSU Bridge…</div>
</div>
<div class="tip">内核原生 0ms 双轨分流 · 单 inotifyd 熔断 · 读时对齐 · 0 定时器</div>
<script>
var SCRIPT='sh /data/adb/modules/rmg_netguard/scripts/netguard.sh ';
var curStatus=null,busy=false;
function $(i){return document.getElementById(i);}
function log(m){$('log_out').textContent='['+new Date().toLocaleTimeString()+'] '+m;}
function execCmd(c,cb){
var d=false,t=null;
function f(r,o,e){if(d)return;d=true;if(t)clearTimeout(t);cb(r||0,o||'',e||'');}
if(typeof ksu==='undefined'||!ksu.exec){f(-1,'','ksu unavailable');return;}
var n='_k'+Date.now()+'_'+Math.floor(Math.random()*1e5);
window[n]=function(r,o,e){try{delete window[n];}catch(x){}f(r||0,o||'',e||'');};
t=setTimeout(function(){try{delete window[n];}catch(x){}f(-2,'','Bridge 超时');},15000);
try{ksu.exec(c,'{}',n);}catch(e){if(d)return;try{delete window[n];}catch(x){}try{f(0,ksu.exec(c)||'','');}catch(x){f(-1,'',String(x));}}
}
function setB(d){['b1','b2','b3','b4'].forEach(function(i){var b=$(i);if(b)b.disabled=d;});}
function render(s){
curStatus=s;if(s.version)$('ui_ver').textContent=s.version;var a=s.mode==='auto';
$('m1').innerHTML='<span class="badge '+(a?'b-ok':'b-info')+'">'+(a?'自动双轨 (Auto)':'只读观测 (Observe)')+'</span>';
$('b1').textContent=a?'切换为只读观测':'切换为自动双轨';
var v=s.vpn===1;
$('m2').innerHTML='<span class="badge '+(v?'b-info':'b-mut')+'">'+(v?'活跃 ('+(s.vpn_if||'VPN')+')':'未连接')+'</span>';
var h=s.hijack===1,tb=s.tun_bypass===1;
$('m3').innerHTML='<span class="badge '+(h?(tb?'b-ok':'b-warn'):'b-mut')+'">'+(h?('已挂载 (-> 5591)'+(tb?' · tun+豁免':' · 缺tun+')):'已摘除 (直通)')+'</span>';
$('b2').textContent=h?'手动摘除劫持':'手动挂载劫持';
var ok=s.agh_pid&&s.agh_pid!=='0'&&s.agh_port===1;
$('m4').innerHTML='<span class="badge '+(ok?'b-ok':'b-risk')+'">'+(s.agh_pid!=='0'?'PID '+s.agh_pid:'未启动')+' / '+(s.agh_port===1?'5591监听':'离线')+'</span>';
var on=s.integ==='on',fb=s.fallback===1;
$('m5').innerHTML='<span class="badge '+(on?(fb?'b-warn':'b-ok'):'b-mut')+'">'+(on?('已开启'+(s.patched==='yes'?'·已补丁':'·待注入')+(fb?' [熔断223]':'')):'已关闭')+'</span>';
$('b3').textContent=on?'还原 Clash 补丁':'开启 Clash 串联';
}
function loadStatus(cb){
if(busy)return;busy=true;setB(true);
execCmd(SCRIPT+'status',function(r,o,e){
busy=false;setB(false);
if(r!==0){log('读取失败: '+(e||o));if(cb)cb();return;}
try{var l=o.trim().split('\n'),s=JSON.parse(l[l.length-1]);render(s);log('已刷新 (PID '+s.agh_pid+', mode='+s.mode+')');}catch(x){log('JSON错误: '+x);}
if(cb)cb();
});
}
function run(name,sub){
if(busy)return;busy=true;setB(true);log('执行: '+name+'…');
execCmd(SCRIPT+sub,function(r,o,e){busy=false;setB(false);log(name+' 完成: '+(o||'').trim()+(e?' ('+e.trim()+')':''));loadStatus();});
}
function actMode(){if(!curStatus){loadStatus();return;}run('切换模式',curStatus.mode==='auto'?'mode_obs':'mode_auto');}
function actHijack(){if(!curStatus){loadStatus();return;}run('变更劫持',curStatus.hijack===1?'detach':'attach');}
function actInteg(){if(!curStatus){loadStatus();return;}run('Clash补丁',curStatus.integ==='on'?'integ_off':'integ_on');}
loadStatus();
</script>
</body>
</html>
